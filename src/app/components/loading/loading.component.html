@if (loadingService.isLoading()) {
    <div class="loading-overlay position-fixed top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center" style="background: rgba(0, 0, 0, 0.7); z-index: 9999;">
        <div class="spinner-border text-primary" role="status" style="width: 50px; height: 50px;">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <div class="spinner-custom" style="width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p class="text-white mt-3 mb-0">Cargando...</p>
    </div>
}
