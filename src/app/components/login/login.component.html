<div class="login-container d-flex justify-content-center align-items-center min-vh-100" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="login-card bg-white p-4 p-md-5 rounded-3 shadow-lg" style="max-width: 450px; width: 100%;">
        <div class="logo text-center mb-3">
            <span class="display-4">🎬 CineApp</span>
        </div>
        <h2 class="text-center mb-4 text-dark">Iniciar Sesión</h2>
        
        <form (ngSubmit)="onSubmit()">
            <div class="form-group mb-3">
                <input type="email" 
                       [(ngModel)]="email" 
                       name="email" 
                       placeholder="Correo electrónico" 
                       class="form-control form-control-lg rounded-3"
                       required>
            </div>
            
            <div class="form-group mb-3">
                <input type="password" 
                       [(ngModel)]="password" 
                       name="password" 
                       placeholder="Contraseña" 
                       class="form-control form-control-lg rounded-3"
                       required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold">Entrar</button>
            
            @if (error) {
                <div class="error alert alert-danger text-center mt-3 py-2">{{error}}</div>
            }
        </form>
        
        <p class="register-link text-center mt-4 text-secondary">
            ¿No tienes cuenta? <a routerLink="/register" class="text-primary text-decoration-none">Regístrate aquí</a>
        </p>
    </div>
</div>
