<div class="admin-movies container-fluid p-3 p-md-4">
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
        <h2 class="mb-0">🎬 Gestionar Películas</h2>
        <button (click)="abrirFormularioCrear()" class="btn btn-success">
            + Agregar Película
        </button>
    </div>

    @if (mostrarFormulario) {
        <div class="modal show d-block" tabindex="-1" style="background: rgba(0,0,0,0.5); z-index: 1050;">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">{{ editando ? 'Editar Película' : 'Nueva Película' }}</h5>
                        <button type="button" class="btn-close" (click)="mostrarFormulario = false"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <input [(ngModel)]="nuevaPelicula.titulo" placeholder="Título" class="form-control">
                        </div>
                        <div class="mb-3">
                            <textarea [(ngModel)]="nuevaPelicula.descripcion" placeholder="Descripción" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <input [(ngModel)]="nuevaPelicula.duracion" type="number" placeholder="Duración (min)" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <input [(ngModel)]="nuevaPelicula.genero" placeholder="Género" class="form-control">
                            </div>
                        </div>
                        <div class="mb-3">
                            <input [(ngModel)]="nuevaPelicula.imagen_url" placeholder="URL de imagen" class="form-control">
                        </div>
                        <div class="mb-3">
                            <input [(ngModel)]="nuevaPelicula.fecha_estreno" type="date" class="form-control">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button (click)="guardarPelicula()" class="btn btn-primary">Guardar</button>
                        <button (click)="mostrarFormulario = false" class="btn btn-secondary">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
    }

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Duración</th>
                    <th>Género</th>
                    <th class="text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                @for (p of peliculas; track p.id) {
                    <tr>
                        <td>{{p.id}}</td>
                        <td>{{p.titulo}}</td>
                        <td>{{p.duracion}} min</td>
                        <td>{{p.genero}}</td>
                        <td class="text-center">
                            <div class="d-flex gap-2 justify-content-center flex-wrap">
                                <button (click)="editarPelicula(p)" class="btn btn-sm btn-warning">✏️ Editar</button>
                                <button (click)="eliminarPelicula(p.id)" class="btn btn-sm btn-danger">🗑️ Eliminar</button>
                            </div>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
