<div class="admin-schedules container-fluid p-3 p-md-4">
    <h2 class="mb-4">📅 Gestionar Horarios</h2>
    
    <!-- Formulario para agregar horario -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Agregar nuevo horario</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3 col-sm-6">
                    <input [(ngModel)]="nuevoHorario.sala" placeholder="Sala" class="form-control">
                </div>
                <div class="col-md-3 col-sm-6">
                    <input [(ngModel)]="nuevoHorario.fecha" type="date" class="form-control">
                </div>
                <div class="col-md-2 col-sm-6">
                    <input [(ngModel)]="nuevoHorario.hora" type="time" class="form-control">
                </div>
                <div class="col-md-2 col-sm-6">
                    <input [(ngModel)]="nuevoHorario.precio" type="number" placeholder="Precio" class="form-control">
                </div>
                <div class="col-md-2 col-sm-12">
                    <button (click)="agregarHorario()" class="btn btn-success w-100">+ Agregar Horario</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Lista de horarios existentes -->
    <div class="card">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Horarios existentes</h5>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label fw-bold">Seleccionar película:</label>
                <select (change)="onPeliculaChange($event)" class="form-select w-auto" style="min-width: 250px;">
                    @for (p of peliculas; track p.id) {
                        <option [value]="p.id">{{p.titulo}}</option>
                    }
                </select>
            </div>
            
            @if (horarios().length > 0) {
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Sala</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Precio</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (h of horarios(); track h.id) {
                                <tr>
                                    <td>{{h.id}}</td>
                                    <td>{{h.sala}}</td>
                                    <td>{{h.fecha | date:'dd/MM/yyyy'}}</td>
                                    <td>{{h.hora}}</td>
                                    <td>S/ {{h.precio}}</td>
                                    <td class="text-center">
                                        <button (click)="eliminarHorario(h.id)" class="btn btn-sm btn-danger">🗑️ Eliminar</button>
                                    </td>
                                </tr>
                            }
                        </tbody>
                    </table>
                </div>
            } @else {
                <div class="alert alert-info text-center mb-0">
                    <i class="bi bi-info-circle"></i> No hay horarios para esta película
                </div>
            }
        </div>
    </div>
</div>
