<div class="admin-products container-fluid p-3 p-md-4">
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
        <h2 class="mb-0">🍿 Gestionar Productos</h2>
        <button (click)="abrirFormularioCrear()" class="btn btn-success">
            + Agregar Producto
        </button>
    </div>

    @if (mostrarFormulario) {
        <div class="modal show d-block" tabindex="-1" style="background: rgba(0,0,0,0.5); z-index: 1050;">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">{{ editando ? 'Editar Producto' : 'Nuevo Producto' }}</h5>
                        <button type="button" class="btn-close" (click)="mostrarFormulario = false"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <input [(ngModel)]="nuevoProducto.nombre" placeholder="Nombre" class="form-control">
                        </div>
                        <div class="mb-3">
                            <input [(ngModel)]="nuevoProducto.descripcion" placeholder="Descripción" class="form-control">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <input [(ngModel)]="nuevoProducto.precio" type="number" placeholder="Precio" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <input [(ngModel)]="nuevoProducto.stock" type="number" placeholder="Stock" class="form-control">
                            </div>
                        </div>
                        <div class="mb-3">
                            <input [(ngModel)]="nuevoProducto.categoria" placeholder="Categoría" class="form-control">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button (click)="guardarProducto()" class="btn btn-primary">Guardar</button>
                        <button (click)="mostrarFormulario = false" class="btn btn-secondary">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
    }

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th class="text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                @for (p of productos; track p.id) {
                    <tr>
                        <td>{{p.id}}</td>
                        <td>{{p.nombre}}</td>
                        <td>S/ {{p.precio}}</td>
                        <td>{{p.stock}}</td>
                        <td>{{p.categoria}}</td>
                        <td class="text-center">
                            <div class="d-flex gap-2 justify-content-center flex-wrap">
                                <button (click)="editarProducto(p)" class="btn btn-sm btn-warning">✏️ Editar</button>
                                <button (click)="eliminarProducto(p.id)" class="btn btn-sm btn-danger">🗑️ Eliminar</button>
                            </div>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
