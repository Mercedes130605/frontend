<div class="register-container d-flex justify-content-center align-items-center min-vh-100 p-3"
     style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="register-card bg-white rounded-4 shadow-lg p-4 p-md-5" style="max-width: 450px; width: 100%;">
        <div class="logo text-center mb-4">
            <span class="display-6 fw-bold">📝 Crear Cuenta</span>
        </div>
        
        <form (ngSubmit)="onSubmit()">
            <div class="form-group mb-3">
                <input type="text" 
                       [(ngModel)]="nombre" 
                       name="nombre" 
                       placeholder="Nombre completo" 
                       class="form-control form-control-lg rounded-3"
                       required>
            </div>
            
            <div class="form-group mb-3">
                <input type="email" 
                       [(ngModel)]="email" 
                       name="email" 
                       placeholder="Correo electrónico" 
                       class="form-control form-control-lg rounded-3"
                       required>
            </div>
            
            <div class="form-group mb-3">
                <input type="password" 
                       [(ngModel)]="password" 
                       name="password" 
                       placeholder="Contraseña" 
                       class="form-control form-control-lg rounded-3"
                       required>
            </div>
            
            <div class="form-group mb-3">
                <input type="password" 
                       [(ngModel)]="confirmPassword" 
                       name="confirmPassword" 
                       placeholder="Confirmar contraseña" 
                       class="form-control form-control-lg rounded-3"
                       required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold mt-2">Registrarse</button>
            
            @if (error) {
                <div class="error alert alert-danger text-center mt-3 py-2 mb-0">{{error}}</div>
            }
            @if (success) {
                <div class="success alert alert-success text-center mt-3 py-2 mb-0">{{success}}</div>
            }
        </form>
        
        <p class="login-link text-center mt-4 text-secondary">
            ¿Ya tienes cuenta? <a routerLink="/login" class="text-primary text-decoration-none fw-semibold">Iniciar Sesión</a>
        </p>
    </div>
</div>
